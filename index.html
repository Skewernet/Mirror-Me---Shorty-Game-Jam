<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIRROR ME</title><style>html,body{margin:0;background:#070606;color:#ddd;font:16px Georgia;overflow:hidden}#menu{position:fixed;inset:0;background:#09090beb;display:grid;place-items:center;text-align:center;z-index:2}h1{font-size:55px;font-weight:400;letter-spacing:14px}button{padding:14px 38px;background:#111;color:#ddd;border:1px solid #888;cursor:pointer;letter-spacing:3px}#hud{position:fixed;inset:0;pointer-events:none}#cross{position:absolute;top:50%;left:50%;background:#fff;width:4px;height:4px;border-radius:50%}#msg{position:absolute;top:25%;text-align:center;width:100%;letter-spacing:4px;text-shadow:0 1px 10px #000}#prompt{position:absolute;top:62%;width:100%;text-align:center;font:12px monospace;letter-spacing:2px}#loop{position:absolute;top:20px;left:20px;font:12px monospace}canvas{display:block;image-rendering:pixelated}</style></head><body><div id="menu"><div><h1>MIRROR ME</h1><p>The house does not remember you.</p><button id="start">ENTER</button><p>WASD MOVE • MOUSE LOOK • E INTERACT • ESC PAUSE</p><p>SHORTY JAM — PROTOTYPE 0.1</p></div></div><div id="hud"><div id="cross"></div><div id="msg"></div><div id="prompt"></div><div id="loop">LOOP 01</div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x09080b);scene.fog=new T.FogExp2(0x09080b,.05);const camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.05,80);const R=new T.WebGLRenderer({antialias:false});R.setPixelRatio(Math.min(devicePixelRatio,1.25));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
scene.add(new T.HemisphereLight(0x777c99,0x21120f,.35));const lamp=new T.PointLight(0xffad70,24,11);lamp.position.set(0,2.7,-1);scene.add(lamp);const red=new T.PointLight(0xff1249,0,12);red.position.set(0,2,4);scene.add(red);
const mat=(c,m=0)=>new T.MeshStandardMaterial({color:c,roughness:m?.2:1,metalness:m?0.7:0,side:T.DoubleSide});const wall=mat(0x49413a),floor=mat(0x29221f),trim=mat(0x21130e),gold=mat(0x76603d),glass=mat(0x263343,1);
function box(w,h,d,x,y,z,m,parent=scene){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}
box(4.4,.18,16,0,-.1,0,floor);box(4.4,.2,16,0,3.3,0,wall);[-1,1].forEach(s=>{box(.2,3.4,16,s*2.2,1.6,0,wall);for(let z=-7;z<=7;z+=2)box(.1,.16,.95,s*2.09,.17,z,trim);for(let z of [-4,1,5]){box(.12,.9,.65,s*2.07,1.95,z,gold);box(.13,.74,.52,s*2.02,1.95,z,trim)}});box(4.4,3.4,.2,0,1.6,-8,wall);box(.8,2.7,.12,-1.6,1.35,8,wall);box(.8,2.7,.12,1.6,1.35,8,wall);box(4.4,.3,.15,0,3.2,8,wall);
const door=box(1.5,2.65,.1,-.95,1.33,-7.8,trim);box(.12,.12,.09,-.45,1.33,-7.68,gold);box(.9,.8,.5,1.4,.4,-3,trim);box(.9,.08,.5,1.4,.8,-3,gold);
const mirror=new T.Group();mirror.position.set(-2.04,1.7,-1);mirror.rotation.y=Math.PI/2;scene.add(mirror);box(1.25,1.85,.13,0,0,0,gold,mirror);box(1.05,1.67,.14,0,0,.015,glass,mirror);const head=new T.Mesh(new T.SphereGeometry(.19,10,8),mat(0x08080a));head.position.set(0,.24,.11);mirror.add(head);box(.37,.72,.15,0,-.34,.11,mat(0x0b0b0d),mirror);
let px=0,pz=5.5,yaw=0,pitch=0,loops=1,started=false,hasKey=false,doorOpen=false,keys={},msgEnd=0,last=performance.now();const $=s=>document.getElementById(s);function say(s){$('msg').textContent=s;msgEnd=performance.now()+2800}function dist(x,z){return Math.hypot(px-x,pz-z)}function nearby(){return dist(-1.3,-1)<2?'mirror':dist(1.4,-3)<1.7?'drawer':dist(-.95,-7)<1.5?'door':null}
function next(){pz=-6.6;loops++;$('loop').textContent='LOOP '+String(loops).padStart(2,'0');if(loops===2){say('SOMETHING IS DIFFERENT');lamp.color.set(0x7788cc);red.intensity=7;head.position.x=.25}else if(loops===3){say('IT IS WATCHING');lamp.intensity=7;red.intensity=20;head.position.x=-.25}else if(loops>=4){say("IT'S MY TURN");document.exitPointerLock?.();$('menu').style.display='grid';$('menu').querySelector('h1').textContent="IT'S MY TURN";$('menu').querySelector('p').textContent='You are on the wrong side of the glass.';started=false}}
$('start').onclick=()=>{started=true;$('menu').style.display='none';R.domElement.requestPointerLock();say('FIND THE WAY OUT')};document.addEventListener('pointerlockchange',()=>{if(started)$('menu').style.display=document.pointerLockElement===R.domElement?'none':'grid'});document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==R.domElement)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.35,Math.min(1.35,pitch-e.movementY*.0022));camera.rotation.set(pitch,yaw,0,'YXZ')});document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&started){const n=nearby();if(n==='mirror'){say(loops===1?'YOUR REFLECTION IS LATE':'IT IS NOT COPYING YOU');head.position.x+=.1}else if(n==='drawer'){hasKey=true;say('YOU FOUND A COLD KEY')}else if(n==='door'){if(hasKey){doorOpen=true;say('THE DOOR UNLOCKS')}else say('LOCKED FROM THE OTHER SIDE')}}});document.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,.05);last=now;if(started&&document.pointerLockElement===R.domElement){const f=Number(!!keys.KeyW)-Number(!!keys.KeyS),s=Number(!!keys.KeyD)-Number(!!keys.KeyA),len=Math.hypot(f,s)||1,speed=dt*2.5;px+=(Math.cos(yaw)*s-Math.sin(yaw)*f)/len*speed;pz+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)/len*speed;px=T.MathUtils.clamp(px,-1.7,1.7);pz=Math.max(-7.3,pz);if(pz>7.65)next();camera.position.set(px,1.62+Math.sin(now*.013)*.015,pz);let n=nearby();$('prompt').textContent=n==='mirror'?'[ E ] INSPECT MIRROR':n==='door'?'[ E ] TRY DOOR':n==='drawer'?'[ E ] OPEN DRAWER':'';if(now>msgEnd)$('msg').textContent=''}R.render(scene,camera)}requestAnimationFrame(tick);
</script></body></html>
